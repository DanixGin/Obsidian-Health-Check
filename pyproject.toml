[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-health-check"
version = "1.0.1"
description = "Read-only Obsidian Vault link-integrity auditor and Codex Skill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DanixGin" }]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2", "build>=1.2,<2", "types-PyYAML>=6.0,<7"]

[project.scripts]
obsidian-health-check = "scripts.obsidian_health:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["scripts"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["scripts"]
